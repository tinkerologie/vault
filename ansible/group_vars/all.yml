plugin_name: vault
version: "{{ lookup('file', playbook_dir + '/../VERSION') }}"
build_dir: "{{ playbook_dir }}/../build"
plugin_binary: "{{ build_dir }}/vault-linux-amd64"
plugin_dir: "/usr/local/emhttp/plugins/{{ plugin_name }}"
config_dir: "/boot/config/plugins/{{ plugin_name }}"
binary_path: "/usr/local/sbin/vault"
rc_script: "/etc/rc.d/rc.vault"

# Options shared by every delegated scp upload. ControlMaster matters: the
# uploads are separate processes, and without a shared connection each one
# authenticates again — Unraid's sshd starts refusing those logins part-way
# through a deploy, which leaves the plugin half-updated with its service
# already stopped.
scp_common_opts: >-
  -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  -o PubkeyAuthentication=no -o PreferredAuthentications=password
  -o ConnectTimeout=10
  -o ControlMaster=auto -o ControlPath=/tmp/.vault-deploy-%r@%h:%p
  -o ControlPersist=120s
api_port: "{{ hostvars[inventory_hostname].api_port | default(24085) }}"
bind_address: "{{ hostvars[inventory_hostname].bind_address | default('127.0.0.1') }}"
verify_local_port: "{{ hostvars[inventory_hostname].verify_local_port | default(42485) }}"
db_path: "{{ config_dir }}/vault.db"
log_path: "/var/log/vault.log"
pid_file: "/var/run/vault.pid"
create_backup: false

# vault.key seals the dedup repo master key and other secrets, and lives in
# config_dir — which the uninstall role wipes. Carry it across an
# uninstall→deploy cycle so a redeploy does not orphan the surviving database.
# False for a standalone `--tags uninstall`, which really should remove it.
server_key_stash: /var/local/vault.key.redeploy
# True only when this run will actually reach the deploy role, which is what
# puts the key back. With no --tags, ansible_run_tags is ["all"], so a run like
# `--skip-tags deploy` would otherwise stash the key and never restore it,
# leaving the surviving database sealed with a key the daemon no longer has.
preserve_server_key: >-
  {{ (['deploy', 'redeploy', 'all'] | select('in', ansible_run_tags) | list | length > 0)
     and (['deploy', 'redeploy'] | select('in', ansible_skip_tags) | list | length == 0) }}

# Vault Replica container
replica_port: "{{ hostvars[inventory_hostname].replica_port | default(24086) }}"
replica_data_dir: /mnt/cache/appdata/vault-replica
replica_storage_dir: /mnt/user/backups/vault-replica
timezone: Australia/Sydney
