[defaults]
stdout_callback = ansible.builtin.default
result_format = yaml
retry_files_enabled = false
roles_path = roles
gathering = smart
callbacks_enabled = ansible.builtin.timer, ansible.builtin.profile_tasks

[ssh_connection]
pipelining = true
# ssh keeps the first value of an option, so these win over ansible_ssh_common_args.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=accept-new
control_path = /tmp/.vault-deploy-%%r@%%h:%%p
