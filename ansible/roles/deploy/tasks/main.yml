---
# Deploy Vault plugin to Unraid
# Uses 'raw' module for remote tasks — Unraid has no Python interpreter
# File transfers use sshpass+scp delegated to localhost; sshpass reads the
# password from a private temp file (sshpass -f), never the command line

- name: Deploy Vault plugin
  block:
    # Check reachability before the password file exists. Ansible runs
    # neither rescue nor always for an unreachable host, so failing here, as
    # an ordinary task failure, is what keeps a down host from leaking the
    # file and still fails fast with the connection error.
    - name: Check server connectivity
      ansible.builtin.raw: echo "ok"
      register: connectivity
      ignore_unreachable: true
      changed_when: false

    - name: Fail when server is unreachable
      delegate_to: localhost
      ansible.builtin.fail:
        msg: "{{ connectivity.msg }}"
      when: connectivity is unreachable

    # A host that drops mid-deploy also skips always, so clear password files
    # left by such an interrupted run (older than an hour, so a concurrent run
    # against another host keeps its own).
    - name: Remove stale SSH password files from interrupted runs
      delegate_to: localhost
      ansible.builtin.find:
        paths: "{{ lookup('ansible.builtin.env', 'TMPDIR') | default('/tmp', true) }}"
        patterns: "vault-sshpass-*"
        age: 1h
      register: stale_sshpass_files
      changed_when: false

    - name: Delete stale SSH password files
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ stale_sshpass_files.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      changed_when: false

    # sshpass reads the password from a private 0600 file, so it never appears
    # on a command line, in an environment prefix, in the process list, or in
    # task output at any verbosity. The file is removed in the always section.
    - name: Create private SSH password file
      delegate_to: localhost
      ansible.builtin.tempfile:
        state: file
        prefix: vault-sshpass-
      register: sshpass_file
      changed_when: false

    - name: Store SSH password in the private file
      delegate_to: localhost
      ansible.builtin.copy:
        content: "{{ ansible_password }}"
        dest: "{{ sshpass_file.path }}"
        mode: "0600"
      no_log: true
      changed_when: false

    - name: Stop existing service
      ansible.builtin.raw: "{{ rc_script }} stop 2>/dev/null; killall vault 2>/dev/null; true"
      register: stop_result
      changed_when: "'no process' not in stop_result.stdout | default('')"

    - name: Wait for service to stop
      ansible.builtin.pause:
        seconds: 2

    - name: Clean up stale USB files
      ansible.builtin.raw: >
        rm -rf {{ config_dir }}.bak.* {{ config_dir }}/vault.db.migrated 2>/dev/null; true
      changed_when: false

    - name: Create plugin directories
      ansible.builtin.raw: >
        mkdir -p
        {{ config_dir }}
        {{ plugin_dir }}
        {{ plugin_dir }}/include
        {{ plugin_dir }}/ui
      changed_when: true

    # Counterpart to the uninstall role's stash: put the pre-existing key back
    # before the daemon starts, so it does not generate a fresh one and orphan
    # every sealed secret in the surviving database.
    - name: Restore the preserved server key
      ansible.builtin.raw: >
        if [ -f {{ server_key_stash }} ]; then
          mv {{ server_key_stash }} {{ config_dir }}/vault.key &&
          chmod 0600 {{ config_dir }}/vault.key &&
          echo RESTORED;
        else
          echo NO_STASH;
        fi
      register: server_key_restore
      changed_when: "'RESTORED' in server_key_restore.stdout | default('')"

    - name: Upload binary via SCP
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >
          sshpass -f '{{ sshpass_file.path }}'
          scp {{ scp_common_opts }}
          {{ plugin_binary }}
          {{ ansible_user }}@{{ ansible_host }}:{{ binary_path }}
      register: scp_binary
      retries: 3
      delay: 3
      until: scp_binary.rc == 0
      changed_when: true

    - name: Set binary permissions
      ansible.builtin.raw: "chmod 0755 {{ binary_path }}"
      changed_when: true

    - name: Upload Vault page via SCP
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >
          sshpass -f '{{ sshpass_file.path }}'
          scp {{ scp_common_opts }}
          {{ playbook_dir }}/../plugin/pages/Vault.page
          {{ ansible_user }}@{{ ansible_host }}:{{ plugin_dir }}/Vault.page
      register: scp_upload_vault_page_via_scp
      retries: 3
      delay: 5
      until: scp_upload_vault_page_via_scp.rc == 0
      changed_when: true

    - name: Upload Backups top-nav page via SCP
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >
          sshpass -f '{{ sshpass_file.path }}'
          scp {{ scp_common_opts }}
          {{ playbook_dir }}/../plugin/pages/Backups.page
          {{ ansible_user }}@{{ ansible_host }}:{{ plugin_dir }}/Backups.page
      register: scp_upload_backups_top_nav_page_via_scp
      retries: 3
      delay: 5
      until: scp_upload_backups_top_nav_page_via_scp.rc == 0
      changed_when: true

    - name: Upload plugin README via SCP
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >
          sshpass -f '{{ sshpass_file.path }}'
          scp {{ scp_common_opts }}
          {{ playbook_dir }}/../plugin/README.md
          {{ ansible_user }}@{{ ansible_host }}:{{ plugin_dir }}/README.md
      register: scp_upload_plugin_readme_via_scp
      retries: 3
      delay: 5
      until: scp_upload_plugin_readme_via_scp.rc == 0
      changed_when: true

    - name: Clean up old sub-page files
      ansible.builtin.raw: >
        rm -f
        {{ plugin_dir }}/VaultJobs.page
        {{ plugin_dir }}/VaultRestore.page
        {{ plugin_dir }}/VaultStorage.page
        {{ plugin_dir }}/VaultHistory.page
        {{ plugin_dir }}/VaultSettings.page
        && rm -rf {{ plugin_dir }}/assets {{ plugin_dir }}/ui
      changed_when: true

    - name: Upload PHP includes via SCP
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >
          sshpass -f '{{ sshpass_file.path }}'
          scp {{ scp_common_opts }}
          {{ playbook_dir }}/../plugin/pages/include/api.php
          {{ ansible_user }}@{{ ansible_host }}:{{ plugin_dir }}/include/api.php
      register: scp_upload_php_includes_via_scp
      retries: 3
      delay: 5
      until: scp_upload_php_includes_via_scp.rc == 0
      changed_when: true

    - name: Upload control.php via SCP
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >
          sshpass -f '{{ sshpass_file.path }}'
          scp {{ scp_common_opts }}
          {{ playbook_dir }}/../plugin/pages/include/control.php
          {{ ansible_user }}@{{ ansible_host }}:{{ plugin_dir }}/include/control.php
      register: scp_upload_control_php_via_scp
      retries: 3
      delay: 5
      until: scp_upload_control_php_via_scp.rc == 0
      changed_when: true

    - name: Upload app.php via SCP
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >
          sshpass -f '{{ sshpass_file.path }}'
          scp {{ scp_common_opts }}
          {{ playbook_dir }}/../plugin/pages/include/app.php
          {{ ansible_user }}@{{ ansible_host }}:{{ plugin_dir }}/include/app.php
      register: scp_upload_app_php_via_scp
      retries: 3
      delay: 5
      until: scp_upload_app_php_via_scp.rc == 0
      changed_when: true

    - name: Upload proxy.php via SCP
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >
          sshpass -f '{{ sshpass_file.path }}'
          scp {{ scp_common_opts }}
          {{ playbook_dir }}/../plugin/pages/include/proxy.php
          {{ ansible_user }}@{{ ansible_host }}:{{ plugin_dir }}/include/proxy.php
      register: scp_upload_proxy_php_via_scp
      retries: 3
      delay: 5
      until: scp_upload_proxy_php_via_scp.rc == 0
      changed_when: true

    - name: Upload apply.sh via SCP
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >
          sshpass -f '{{ sshpass_file.path }}'
          scp {{ scp_common_opts }}
          {{ playbook_dir }}/../plugin/pages/include/apply.sh
          {{ ansible_user }}@{{ ansible_host }}:{{ plugin_dir }}/include/apply.sh
      register: scp_upload_apply_sh_via_scp
      retries: 3
      delay: 5
      until: scp_upload_apply_sh_via_scp.rc == 0
      changed_when: true

    - name: Set apply.sh permissions
      ansible.builtin.raw: "chmod 0755 {{ plugin_dir }}/include/apply.sh"
      changed_when: true

    - name: Recreate emhttp event script directory
      ansible.builtin.raw: "mkdir -p {{ plugin_dir }}/event"
      changed_when: true

    - name: Upload emhttp event scripts via SCP
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >
          sshpass -f '{{ sshpass_file.path }}'
          scp {{ scp_common_opts }}
          {{ playbook_dir }}/../plugin/event/started
          {{ playbook_dir }}/../plugin/event/stopping_svcs
          {{ ansible_user }}@{{ ansible_host }}:{{ plugin_dir }}/event/
      register: scp_upload_emhttp_event_scripts_via_scp
      retries: 3
      delay: 5
      until: scp_upload_emhttp_event_scripts_via_scp.rc == 0
      changed_when: true

    - name: Set event script permissions
      ansible.builtin.raw: "chmod 0755 {{ plugin_dir }}/event/started {{ plugin_dir }}/event/stopping_svcs"
      changed_when: true

    - name: Recreate proxied web UI directory
      ansible.builtin.raw: "mkdir -p {{ plugin_dir }}/ui"
      changed_when: true

    - name: Upload proxied web UI via SCP
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >
          sshpass -f '{{ sshpass_file.path }}'
          scp -r {{ scp_common_opts }}
          {{ playbook_dir }}/../web/dist/.
          {{ ansible_user }}@{{ ansible_host }}:{{ plugin_dir }}/ui/
      register: scp_upload_proxied_web_ui_via_scp
      retries: 3
      delay: 5
      until: scp_upload_proxied_web_ui_via_scp.rc == 0
      changed_when: true

    - name: Write plugin config file
      ansible.builtin.raw: |
        if [ ! -f {{ config_dir }}/vault.cfg ]; then
          cat > {{ config_dir }}/vault.cfg << 'CFGEOF'
        SERVICE="yes"
        PORT="{{ api_port }}"
        BIND_ADDRESS="{{ bind_address }}"
        CFGEOF
          chmod 0644 {{ config_dir }}/vault.cfg
        fi
      changed_when: true

    # Ship the real plugin/rc.vault rather than an inline copy, so deploys
    # exercise exactly the service script users get from the .plg package
    # (the inline copy had drifted: it sourced vault.cfg and ignored
    # MDNS_ADVERTISE, #468).
    - name: Upload RC script via SCP
      delegate_to: localhost
      ansible.builtin.command:
        cmd: >
          sshpass -f '{{ sshpass_file.path }}'
          scp {{ scp_common_opts }}
          {{ playbook_dir }}/../plugin/rc.vault
          {{ ansible_user }}@{{ ansible_host }}:{{ rc_script }}
      register: scp_rc_script
      retries: 3
      delay: 3
      until: scp_rc_script.rc == 0
      changed_when: true

    - name: Set RC script permissions
      ansible.builtin.raw: "chmod 0755 {{ rc_script }}"
      changed_when: true

    - name: Start Vault daemon
      ansible.builtin.raw: "{{ rc_script }} start"
      changed_when: true

    - name: Wait for API to be ready
      # Probe the address rc.vault actually passed to the daemon (--addr),
      # so vault.cfg parsing, defaults and the non-local fallback never
      # have to be duplicated here.
      ansible.builtin.raw: |
        PID="$(pidof -s vault)"
        [ -n "$PID" ] || exit 1
        ADDR="$(tr '\0' '\n' < "/proc/$PID/cmdline" | sed -n 's/^--addr=//p' | head -1)"
        [ -n "$ADDR" ] || exit 1
        URL_HOST="${ADDR%:*}"
        PORT_VALUE="${ADDR##*:}"
        case "$URL_HOST" in
          0.0.0.0|"[::]") URL_HOST="127.0.0.1" ;;
        esac
        curl -fsS "http://${URL_HOST}:${PORT_VALUE}/api/v1/health" >/dev/null
      register: health_check
      retries: 10
      delay: 2
      until: health_check.rc == 0
      changed_when: false

    - name: Read effective daemon bind
      ansible.builtin.raw: |
        PID="$(pidof -s vault)"
        BIND_VALUE=""
        if [ -n "$PID" ]; then
          BIND_VALUE="$(tr '\0' '\n' < "/proc/$PID/cmdline" | sed -n 's/^--addr=//p' | head -1)"
        fi
        echo "${BIND_VALUE:-unknown}"
      register: daemon_bind_info
      changed_when: false

    - name: Show service status
      ansible.builtin.raw: "pidof vault"
      register: pid_result
      changed_when: false

    - name: Report deployment
      ansible.builtin.debug:
        msg: "Vault v{{ version }} deployed (PID: {{ pid_result.stdout | trim }}) — daemon bind {{ daemon_bind_info.stdout | trim }}, UI via /plugins/{{ plugin_name }}/include/app.php#/"

  rescue:
    - name: Deploy failed — collect logs
      ansible.builtin.raw: "tail -50 {{ log_path }} 2>/dev/null || echo 'No logs available'"
      register: vault_logs
      ignore_errors: true
      changed_when: false

    - name: Display error logs
      ansible.builtin.debug:
        msg: "{{ vault_logs.stdout_lines | default(['No logs available']) }}"

    - name: Deploy failed — ensure service is stopped
      ansible.builtin.raw: "killall -9 vault 2>/dev/null; true"
      changed_when: false

    - name: Fail with deployment error
      ansible.builtin.fail:
        msg: "Vault deployment failed. Check logs above."

  always:
    - name: Remove SSH password file
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ sshpass_file.path }}"
        state: absent
      when: sshpass_file.path is defined
      changed_when: false
