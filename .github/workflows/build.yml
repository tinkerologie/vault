name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Download Go dependencies
        run: go mod download

      - name: Build web assets
        run: cd web && npm ci && npm run build

      - name: Copy CHANGELOG.md into embed location
        # The `internal/release` package uses //go:embed CHANGELOG.md, but Go's
        # embed rules forbid parent-directory paths in the pattern, so the
        # repo-root CHANGELOG.md must be copied next to the directive before
        # any Go tool (linter, tests, build) sees the package. The Makefile
        # has this as a prerequisite on every relevant target; this workflow
        # invokes go/golangci-lint directly so it needs the copy step inline.
        # Mirror the canonical idiom from Makefile:65-67.
        run: mkdir -p internal/release && cp CHANGELOG.md internal/release/CHANGELOG.md

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest
          args: --config .golangci.yml --max-issues-per-linter 0 --max-same-issues 0

      - name: Run Go tests with coverage
        run: go test ./internal/... ./cmd/... -v -coverprofile=coverage.txt -covermode=atomic -coverpkg=./internal/...,./cmd/...

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: backend
          disable_search: true
          fail_ci_if_error: false

      - name: Run web tests with coverage and JUnit output
        run: cd web && npm ci && npx vitest run --coverage --reporter=default --reporter=junit --outputFile=./test-report.junit.xml

      - name: Upload web coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./web/coverage/lcov.info
          flags: frontend
          disable_search: true
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./web/test-report.junit.xml

      - name: Cross-compile Linux binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          VERSION=$(cat VERSION)
          DATE=$(date '+%Y.%m.%d')
          HASH=$(git rev-parse --short HEAD)
          go build -ldflags "-s -w -X main.version=${VERSION} -X main.buildDate=${DATE} -X main.commit=${HASH}" \
            -o build/vault-linux-amd64 ./cmd/vault/

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: vault-linux-amd64
          path: build/vault-linux-amd64

      - name: Cross-compile Windows binary
        # `vault recover` reads backups without a server and is supported on
        # Windows (issue #313); the rest of the binary must keep compiling.
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          VERSION=$(cat VERSION)
          DATE=$(date '+%Y.%m.%d')
          HASH=$(git rev-parse --short HEAD)
          go build -ldflags "-s -w -X main.version=${VERSION} -X main.buildDate=${DATE} -X main.commit=${HASH}" \
            -o build/vault-windows-amd64.exe ./cmd/vault/

      - name: Lint Windows-only code paths
        # internal/cli is linted for Linux only: its daemon wiring calls
        # Linux-only engine stubs that staticcheck flags under GOOS=windows.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: windows
        with:
          version: latest
          args: --config .golangci.yml --max-issues-per-linter 0 --max-same-issues 0 ./internal/recovery/... ./internal/fsstat/... ./internal/safepath/... ./internal/storage/...

      - name: Upload Windows binary
        uses: actions/upload-artifact@v7
        with:
          name: vault-windows-amd64
          path: build/vault-windows-amd64.exe

  recovery-fixture:
    # Builds real backups on Linux, with file names Windows cannot store, for
    # the windows job to recover. Archived as one tar because artifact uploads
    # reject some of the names involved.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: Build recovery fixture
        run: |
          mkdir -p "$RUNNER_TEMP/fixture"
          VAULT_RECOVERY_FIXTURE_OUT="$RUNNER_TEMP/fixture" \
            go test ./internal/recovery/ -run '^TestWriteRecoveryFixture$' -count=1 -v
          tar -C "$RUNNER_TEMP/fixture" -cf recovery-fixture.tar .

      - name: Upload recovery fixture
        uses: actions/upload-artifact@v7
        with:
          name: recovery-fixture
          path: recovery-fixture.tar
          retention-days: 3

  windows:
    # Runs the recovery code on Windows and recovers the Linux-built fixture,
    # so Windows path, name and filesystem behaviour is tested for real.
    needs: recovery-fixture
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: Download recovery fixture
        uses: actions/download-artifact@v7
        with:
          name: recovery-fixture

      - name: Unpack recovery fixture
        # GNU tar reads "D:\..." as a remote host:path, so give it the
        # POSIX form of the runner's temp directory.
        run: |
          FIXTURE="$(cygpath -u "$RUNNER_TEMP")/fixture"
          mkdir -p "$FIXTURE"
          tar -xf recovery-fixture.tar -C "$FIXTURE"

      - name: Test portable packages and recover the fixture
        run: |
          VAULT_RECOVERY_FIXTURE="$(cygpath -w "$RUNNER_TEMP/fixture")" \
            go test ./internal/recovery/... ./internal/fsstat/... ./internal/dedup/... ./internal/crypto/... -count=1 -v
          # safepath's other tests describe the daemon's Unix behaviour;
          # JoinRemote is the part a Windows client relies on.
          go test ./internal/safepath/ -run 'JoinRemote' -count=1 -v
