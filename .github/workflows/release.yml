name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g., v2026.03.00)
        required: true
        type: string

permissions:
  contents: read # jobs request only what they need

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release and tag
    env:
      CGO_ENABLED: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3

          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

          package-manager-cache: false

      - name: Extract version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            VERSION=${TAG#v}
          else
            TAG=${GITHUB_REF#refs/tags/}
            VERSION=${TAG#v}
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (Tag: $TAG)"

          if [[ "$VERSION" =~ (alpha|beta|rc) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify VERSION file matches tag
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '\n')

          if [ "$FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: VERSION file ($FILE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

          echo "VERSION file matches tag: $TAG_VERSION"

      - name: Download Go dependencies
        run: go mod download

      - name: Build web assets
        run: cd web && npm ci && npm run build

      - name: Run tests
        # Route through `make test` (rather than `go test ./... -v` directly)
        # so the Makefile prerequisite copies CHANGELOG.md into
        # internal/release/CHANGELOG.md before compilation. The
        # internal/release package uses //go:embed CHANGELOG.md, which
        # cannot reach the repo-root file directly because Go forbids
        # parent-directory paths in embed patterns.
        run: make test

      - name: Build release notes helper
        run: go build -o build/plgnotes ./cmd/plgnotes

      - name: Build release package
        env:
          VERSION_VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Building release package..."
          make package

          PACKAGE_FILE="build/vault-${VERSION_VERSION}.txz"
          if [ ! -f "$PACKAGE_FILE" ]; then
            echo "ERROR: Package file not found: $PACKAGE_FILE"
            ls -la build/
            exit 1
          fi

          echo "Package created: $PACKAGE_FILE"
          ls -lh "$PACKAGE_FILE"

      - name: Build Windows recovery binary
        # The Windows build is published for `vault recover`, which reads
        # backups straight from storage when no Vault server is available.
        run: |
          make build-windows
          cd build && sha256sum vault-windows-amd64.exe > vault-windows-amd64.exe.sha256

      - name: Extract release notes from CHANGELOG
        env:
          VERSION_VERSION: ${{ steps.version.outputs.version }}
        run: |
          build/plgnotes extract --changelog CHANGELOG.md \
            --version "$VERSION_VERSION" --output build/RELEASE_NOTES_BASE.md
          cp build/RELEASE_NOTES_BASE.md build/RELEASE_NOTES.md

          echo "Release notes body:"
          cat build/RELEASE_NOTES.md

      - name: Validate plugin release notes before publication
        env:
          VERSION_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp plugin/vault.plg build/vault-validation.plg
          build/plgnotes update-plg --manifest build/vault-validation.plg \
            --notes build/RELEASE_NOTES_BASE.md --version "$VERSION_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }}
          body_path: build/RELEASE_NOTES.md
          files: |
            build/vault-${{ steps.version.outputs.version }}.txz
            build/vault-windows-amd64.exe
            build/vault-windows-amd64.exe.sha256
          prerelease: ${{ steps.version.outputs.prerelease }}
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate GitHub-hosted SHA256 checksum
        id: checksum
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          VERSION_VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="${VERSION_TAG}"
          VERSION="${VERSION_VERSION}"
          ASSET="vault-${VERSION}.txz"
          PACKAGE_FILE="/tmp/${ASSET}"

          rm -f "$PACKAGE_FILE"

          for attempt in 1 2 3 4 5; do
            if gh release download "$TAG" --repo "${GITHUB_REPOSITORY}" --pattern "$ASSET" --dir /tmp; then
              break
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "ERROR: failed to download GitHub-hosted asset after $attempt attempts"
              exit 1
            fi

            echo "Asset not available yet, retrying in 5 seconds..."
            sleep 5
          done

          SHA256=$(sha256sum "$PACKAGE_FILE" | awk '{print $1}')

          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "GitHub-hosted SHA256 checksum: $SHA256"

          printf "%s\n" "$SHA256" > build/SHA256SUM

      - name: Upload SHA256 checksum asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release upload "${VERSION_TAG}" build/SHA256SUM --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Refresh release body with GitHub-hosted SHA256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_VERSION: ${{ steps.version.outputs.version }}
          CHECKSUM_SHA256: ${{ steps.checksum.outputs.sha256 }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          VERSION="${VERSION_VERSION}"

          {
            cat build/RELEASE_NOTES_BASE.md
            echo
            echo "---"
            echo
            echo "**SHA256 Checksum:**"
            echo '```'
            echo "${CHECKSUM_SHA256}  vault-${VERSION}.txz"
            echo '```'
          } > build/RELEASE_NOTES.md

          gh release edit "${VERSION_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --notes-file build/RELEASE_NOTES.md

      - name: Update PLG file for txz and SHA256
        env:
          CHECKSUM_SHA256: ${{ steps.checksum.outputs.sha256 }}
          VERSION_VERSION: ${{ steps.version.outputs.version }}
        run: |
          SHA256="${CHECKSUM_SHA256}"
          export SHA256

          echo "Updating PLG file with SHA256: $SHA256"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path("plugin/vault.plg")
          text = path.read_text()
          sha = os.environ["SHA256"]
          # Each regex captures the original leading whitespace (\1) and
          # reuses it in the replacement so we never alter file indentation.
          text = re.sub(r'(?m)^([ \t]*)<!ENTITY bundle\s+".*?">',
                        r'\1<!ENTITY bundle    "&name;-&version;.txz">', text)
          text = re.sub(r'(?m)^([ \t]*)<!ENTITY (?:md5|sha256)\s+".*?">',
                        r'\1<!ENTITY sha256      "' + sha + r'">', text)
          text = re.sub(r'(?m)^([ \t]*)<(?:MD5|SHA256)>&(?:md5|sha256);</(?:MD5|SHA256)>',
                        r'\1<SHA256>&sha256;</SHA256>', text)
          path.write_text(text)
          PY

          build/plgnotes update-plg --manifest plugin/vault.plg \
            --notes build/RELEASE_NOTES_BASE.md --version "$VERSION_VERSION"

          echo "Updated PLG file"
          grep "ENTITY bundle" plugin/vault.plg
          grep "ENTITY sha256" plugin/vault.plg

      # main requires pull requests; the Unraid plugin manager and Community Applications read
      # the .plg from main, so its new hash is pushed with the Tinkerologie-Release app, the
      # only actor the ruleset lets bypass that rule (GITHUB_TOKEN cannot be a bypass actor).
      - name: Mint Tinkerologie-Release token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TINKER_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.TINKER_RELEASE_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # push the PLG hash commit to main

      - name: Commit and push PLG updates
        env:
          CHECKSUM_SHA256: ${{ steps.checksum.outputs.sha256 }}
          VERSION_VERSION: ${{ steps.version.outputs.version }}
          PLG_PUSH_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet plugin/vault.plg; then
            echo "No changes to PLG file"
          else
            git fetch origin main
            git restore plugin/vault.plg
            git checkout main
            git pull origin main

            SHA256="${CHECKSUM_SHA256}"
            export SHA256
          python3 <<'PY'
          from pathlib import Path
          import os, re
          path = Path("plugin/vault.plg")
          text = path.read_text()
          sha = os.environ["SHA256"]
          # Preserve original leading whitespace via backreference (\1) so
          # the workflow never drifts the indentation in vault.plg.
          text = re.sub(r'(?m)^([ \t]*)<!ENTITY bundle\s+".*?">',
                        r'\1<!ENTITY bundle    "&name;-&version;.txz">', text)
          text = re.sub(r'(?m)^([ \t]*)<!ENTITY (?:md5|sha256)\s+".*?">',
                        r'\1<!ENTITY sha256      "' + sha + r'">', text)
          text = re.sub(r'(?m)^([ \t]*)<(?:MD5|SHA256)>&(?:md5|sha256);</(?:MD5|SHA256)>',
                        r'\1<SHA256>&sha256;</SHA256>', text)
          path.write_text(text)
          PY

            build/plgnotes update-plg --manifest plugin/vault.plg \
              --notes build/RELEASE_NOTES_BASE.md --version "$VERSION_VERSION"

            if git diff --quiet plugin/vault.plg; then
              echo "PLG checksum and release notes already published"
            else
              git add plugin/vault.plg
              git commit -m "chore: update PLG SHA256 and release notes for v${VERSION_VERSION} [skip ci]"
              git push "https://x-access-token:${PLG_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
              echo "Committed and pushed PLG updates"
            fi
          fi

      - name: Release Summary
        env:
          VERSION_VERSION: ${{ steps.version.outputs.version }}
          CHECKSUM_SHA256: ${{ steps.checksum.outputs.sha256 }}
        run: |
          echo "## v${VERSION_VERSION} Released!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** vault-${VERSION_VERSION}.txz" >> $GITHUB_STEP_SUMMARY
          echo "**GitHub-hosted SHA256:** ${CHECKSUM_SHA256}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION_VERSION}" >> $GITHUB_STEP_SUMMARY
